[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "institutional-flow-poc"
version = "0.1.0"
description = "TWSE official institutional sector rotation proof of concept"
requires-python = ">=3.9"

[project.scripts]
institutional-flow-poc = "institutional_flow_poc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
